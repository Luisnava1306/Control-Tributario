<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal y Contable, A.C. - Control Tributario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App (SDK core) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Database -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- HEADER -->
        <header class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">Legal y Contable, A.C.</h1>
                <p class="text-xs text-slate-400">Control Tributario y Parafiscal en Tiempo Real</p>
            </div>
            <div id="sync-status" class="text-xs bg-emerald-900/50 text-emerald-300 px-3 py-1.5 rounded-full border border-emerald-700 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado con la nube
            </div>
        </header>

        <!-- PANEL DE CONTROL / FORMULARIOS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Registrar Cliente / Grupo -->
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow">
                <h2 class="text-sm font-semibold text-slate-200 mb-3 uppercase tracking-wider">Gestión de Clientes y Grupos</h2>
                <div class="space-y-3">
                    <input type="text" id="client-name" placeholder="Nombre de la Empresa / Cliente" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <input type="text" id="client-group" placeholder="Grupo o Sucursal (Opcional)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="addClient()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">Agregar Cliente</button>
                </div>
            </div>

            <!-- Registrar Obligación -->
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow">
                <h2 class="text-sm font-semibold text-slate-200 mb-3 uppercase tracking-wider">Registro de Obligación</h2>
                <div class="space-y-3">
                    <select id="obligation-client" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="">Seleccione un Cliente...</option>
                    </select>
                    <input type="text" id="obligation-name" placeholder="Nombre del Impuesto / Obligación (Ej: IVA, ISLR)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <input type="text" id="obligation-date" placeholder="Fecha límite (dd/mm/aaaa)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="addObligation()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-sm transition">Registrar Obligación</button>
                </div>
            </div>
        </div>

        <!-- LISTADO Y REPORTES -->
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow">
            <h2 class="text-sm font-semibold text-slate-200 mb-4 uppercase tracking-wider">Directorio y Estado de Obligaciones</h2>
            <div id="data-container" class="space-y-4">
                <p class="text-xs text-slate-400 text-center py-6">Cargando datos desde la nube...</p>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONFIGURACIÓN Y CONEXIÓN FIREBASE -->
    <script>
        // Configuración de Firebase para Legal y Contable, A.C.
        const firebaseConfig = {
            databaseURL: "https://control-tributario-default-rtdb.firebaseio.com/"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let dbClients = [];
        let dbObligations = [];

        // Escuchar cambios en tiempo real desde la nube
        db.ref('clients').on('value', (snapshot) => {
            const data = snapshot.val();
            dbClients = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            updateUI();
        });

        db.ref('obligations').on('value', (snapshot) => {
            const data = snapshot.val();
            dbObligations = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            updateUI();
        });

        function addClient() {
            const name = document.getElementById('client-name').value.trim();
            const group = document.getElementById('client-group').value.trim();
            if (!name) {
                alert('Por favor ingrese el nombre del cliente.');
                return;
            }
            db.ref('clients').push({ name, group });
            document.getElementById('client-name').value = '';
            document.getElementById('client-group').value = '';
        }

        function addObligation() {
            const clientId = document.getElementById('obligation-client').value;
            const name = document.getElementById('obligation-name').value.trim();
            const date = document.getElementById('obligation-date').value.trim();
            
            if (!clientId || !name || !date) {
                alert('Por favor complete todos los campos de la obligación.');
                return;
            }
            db.ref('obligations').push({ clientId, name, date, status: 'Pendiente' });
            document.getElementById('obligation-name').value = '';
            document.getElementById('obligation-date').value = '';
        }

        function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'Pendiente' ? 'Completado' : 'Pendiente';
            db.ref('obligations/' + id).update({ status: newStatus });
        }

        function deleteObligation(id) {
            if (confirm('¿Desea eliminar esta obligación?')) {
                db.ref('obligations/' + id).remove();
            }
        }

        function updateUI() {
            // Actualizar selector de clientes
            const select = document.getElementById('obligation-client');
            select.innerHTML = '<option value="">Seleccione un Cliente...</option>';
            dbClients.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.name} ${c.group ? '(' + c.group + ')' : ''}</option>`;
            });

            // Renderizar listado principal
            const container = document.getElementById('data-container');
            if (dbClients.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">No hay clientes registrados aún.</p>';
                return;
            }

            let html = '';
            dbClients.forEach(client => {
                const clientObs = dbObligations.filter(o => o.clientId === client.id);
                html += `
                    <div class="border border-slate-700 bg-slate-900/50 rounded-xl p-4">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-sm text-emerald-400">${client.name}</h3>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">${client.group || 'Sin Grupo'}</span>
                        </div>
                `;

                if (clientObs.length === 0) {
                    html += `<p class="text-xs text-slate-500 italic">Sin obligaciones registradas.</p>`;
                } else {
                    html += `<div class="space-y-2 mt-2">`;
                    clientObs.forEach(obs => {
                        const isDone = obs.status === 'Completado';
                        html += `
                            <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded-lg border border-slate-700/60 text-xs">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" ${isDone ? 'checked' : ''} onclick="toggleStatus('${obs.id}', '${obs.status}')" class="w-4 h-4 accent-emerald-500 cursor-pointer">
                                    <div>
                                        <p class="${isDone ? 'line-through text-slate-500' : 'text-slate-200'} font-medium">${obs.name}</p>
                                        <p class="text-[10px] text-slate-400">Vence: ${obs.date}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded text-[10px] ${isDone ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-amber-950 text-amber-300 border border-amber-800'}">${obs.status}</span>
                                    <button onclick="deleteObligation('${obs.id}')" class="text-red-400 hover:text-red-300 font-bold px-1.5 py-0.5">✕</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
